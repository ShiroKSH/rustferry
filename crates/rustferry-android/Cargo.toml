[package]
name = "rustferry-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rustferry-android"
readme.workspace = true
keywords = ["rust", "android", "cargo", "apk", "no-gradle"]
categories = ["development-tools::build-utils"]
description = "Build signed Android APKs from Rust and Cargo without maintaining a Gradle project"
include = [
    "src/**",
    "java/**",
    "tests/golden/**",
    "tests/fixtures/**",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
camino.workspace = true
directories.workspace = true
fs2.workspace = true
hex.workspace = true
rustferry-codegen = { version = "=0.1.0", path = "../rustferry-codegen" }
rustferry-core = { version = "=0.1.0", path = "../rustferry-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
