[package]
name = "rustferry-apple"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rustferry-apple"
readme.workspace = true
keywords = ["rust", "ios", "cargo", "xcode", "mobile"]
categories = ["development-tools::build-utils"]
description = "Generate disposable Xcode hosts and iOS artifacts for RustFerry applications"
include = [
    "assets/**",
    "src/**",
    "templates/**",
    "tests/golden.rs",
    "tests/golden/**",
    "tests/fixtures/**",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
camino.workspace = true
hex.workspace = true
openssl.workspace = true
rustferry-codegen = { version = "=0.1.0", path = "../rustferry-codegen" }
rustferry-core = { version = "=0.1.0", path = "../rustferry-core" }
rustferry-remote = { version = "=0.1.0", path = "../rustferry-remote" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
plist.workspace = true

[lints]
workspace = true
