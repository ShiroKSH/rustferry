[package]
name = "cargo-ferry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Build Rust applications for Android and iOS without user-maintained platform projects"
documentation = "https://docs.rs/cargo-ferry"
include = [
    "build.rs",
    "src/**",
    "embedded-docs/**",
    "tests/fixtures/**",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[[bin]]
name = "cargo-ferry"
path = "src/main.rs"

[dependencies]
base64.workspace = true
camino.workspace = true
cap-std = { workspace = true, features = ["fs_utf8"] }
clap.workspace = true
clap_complete = "4.5.55"
directories.workspace = true
fs2.workspace = true
keyring.workspace = true
libc.workspace = true
rustferry-android = { version = "=0.1.0", path = "../rustferry-android" }
rustferry-apple = { version = "=0.1.0", path = "../rustferry-apple" }
rustferry-codegen = { version = "=0.1.0", path = "../rustferry-codegen" }
rustferry-core = { version = "=0.1.0", path = "../rustferry-core" }
rustferry-github = { version = "=0.1.0", path = "../rustferry-github", features = ["secure-job-log-http"] }
rustferry-remote = { version = "=0.1.0", path = "../rustferry-remote" }
rustferry-ssh = { version = "=0.1.0", path = "../rustferry-ssh" }
rustferry-runtime-contract = { package = "rustferry", version = "=0.1.0", path = "../rustferry", default-features = false }
rpassword.workspace = true
same-file.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml_edit = "0.25.13"
uuid.workspace = true

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"

[lints]
workspace = true
