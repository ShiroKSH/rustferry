version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/examples/counter"
      - "/examples/kitchen-sink"
      - "/examples/live-score"
      - "/examples/network-guard"
      - "/examples/notifications"
      - "/examples/widget-counter"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
