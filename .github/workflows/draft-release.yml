name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching every workspace crate and the VS Code extension
        required: true
        type: string
      create_draft_release:
        description: Create a protected draft GitHub Release after assembly
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: rustferry-draft-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  assemble:
    name: Verify and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: "false"
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libfontconfig1-dev
      - name: Verify requested version
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          version="${REQUESTED_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $REQUESTED_VERSION" >&2
            exit 1
          fi
          python3 scripts/check-release-contract.py --expected-version "$version"
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Install extension dependencies
        working-directory: editors/vscode
        run: npm ci
      - name: License policy
        run: python3 scripts/check-licenses.py
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --locked --workspace --all-features
      - name: Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: Package and publish dry-run
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rustferry-release-target
        shell: bash
        run: |
          set -euo pipefail
          for crate in \
            rustferry-core \
            rustferry \
            rustferry-codegen \
            rustferry-apple \
            rustferry-android \
            cargo-ferry
          do
            cargo package --locked -p "$crate" --list \
              > "$RUNNER_TEMP/$crate-package-files.txt"
          done
          cargo package --workspace --locked
          cargo publish --workspace --dry-run --locked --no-verify
          python3 scripts/check-release-archives.py "$CARGO_TARGET_DIR"/package/*.crate
      - name: Build real CLI protocol fixture
        run: cargo build --locked -p cargo-ferry
      - name: Extension checks and VSIX
        working-directory: editors/vscode
        env:
          RUSTFERRY_TEST_CLI: ${{ github.workspace }}/target/debug/cargo-ferry
        run: npm run check
      - name: Assemble release files
        id: assemble
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_DIRECTORY: ${{ runner.temp }}/rustferry-release-target/package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist license-bundle/LICENSES
          cp "$PACKAGE_DIRECTORY"/*.crate dist/
          test "$(find dist -maxdepth 1 -name '*.crate' | wc -l | tr -d ' ')" -eq 6
          cp editors/vscode/dist/rustferry-vscode.vsix \
            "dist/rustferry-vscode-$RELEASE_VERSION.vsix"
          jq -e 'type == "object" and .["$schema"] != null' \
            schemas/ide-protocol-v1.schema.json > /dev/null
          cp schemas/ide-protocol-v1.schema.json dist/
          cp LICENSE-APACHE LICENSE-MIT docs/THIRD_PARTY_LICENSES.md license-bundle/
          cp -R LICENSES/. license-bundle/LICENSES/
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "dist/rustferry-licenses-$RELEASE_VERSION.tar.gz" \
            license-bundle
          python3 - "$RELEASE_VERSION" "$GITHUB_SHA" <<'PY'
          from pathlib import Path
          import re
          import sys

          version, revision = sys.argv[1:]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = rf"^## \[?v?{re.escape(version)}\]?(?:\s+-.*)?\s*$\n"
          match = re.search(heading + r"(.*?)(?=^## |\Z)", changelog, re.M | re.S)
          if match is None or not match.group(1).strip():
              raise SystemExit(f"CHANGELOG.md has no release notes for {version}")
          if "No public release has been cut." in match.group(1):
              raise SystemExit("CHANGELOG.md still marks the project as unreleased")
          notes = (
              f"# RustFerry {version}\n\n"
              f"Revision: `{revision}`\n\n"
              f"{match.group(1).strip()}\n"
          )
          Path("dist/RELEASE_NOTES.md").write_text(notes, encoding="utf-8")
          PY
          (
            cd dist
            checksum_file="$RUNNER_TEMP/rustferry-SHA256SUMS"
            find . -maxdepth 1 -type f \
              ! -name SHA256SUMS \
              -print \
              | LC_ALL=C sort \
              | while IFS= read -r file; do shasum -a 256 "$file"; done \
              > "$checksum_file"
            mv "$checksum_file" SHA256SUMS
            shasum -a 256 -c SHA256SUMS
          )
      - name: Upload release assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rustferry-release-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create protected draft
    if: ${{ inputs.create_draft_release }}
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require exact revision checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ github.sha }}
        run: >-
          python3 scripts/require-release-checks.py
          --repository "$GITHUB_REPOSITORY"
          --sha "$RELEASE_REVISION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rustferry-release-${{ needs.assemble.outputs.version }}
          path: dist
      - name: Verify release assembly
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.assemble.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release already exists: $tag" >&2
            exit 1
          fi
          python3 scripts/require-release-checks.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --create-tag "$tag"
          if ! gh release create "$tag" \
            dist/*.crate \
            dist/*.json \
            dist/*.md \
            dist/*.tar.gz \
            dist/*.vsix \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "RustFerry $RELEASE_VERSION" \
            --notes-file dist/RELEASE_NOTES.md \
            --draft; then
            echo "Draft creation failed; retained refs/tags/$tag at $GITHUB_SHA for manual inspection." >&2
            exit 1
          fi
          python3 scripts/require-release-checks.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --verify-tag "$tag"
