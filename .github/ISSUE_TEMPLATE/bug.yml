name: Bug report
description: Report a reproducible RustFerry failure or incorrect result
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve RustFerry. Remove credentials, signing material, tokens, and private paths from all examples and logs. Report vulnerabilities through the security policy instead of a public issue.

  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I searched existing issues for the same failure.
          required: true
        - label: I removed secrets and private data from this report.
          required: true

  - type: input
    id: revision
    attributes:
      label: RustFerry version or revision
      description: Use `cargo ferry --version` or a commit SHA.
      placeholder: cargo-ferry 0.1.0 or commit SHA
    validations:
      required: true

  - type: dropdown
    id: target
    attributes:
      label: Affected target
      options:
        - Host CLI, configuration, or code generation
        - Android
        - iOS Simulator
        - Multiple or unsure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS, Rust version, and relevant Android or Xcode toolchain versions.
      placeholder: |
        Host: macOS 26 arm64
        Rust: 1.92.0
        Target/toolchain: Android API 35 and NDK 29, or Xcode version
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the exact commands and the smallest safe `ferry.toml` or project fragment needed to reproduce the problem.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: evidence
    attributes:
      label: Highest validation level reached
      options:
        - Host or compile only
        - Artifact inspected
        - Simulator or emulator observed
        - Physical device observed
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Paste relevant `cargo ferry --verbose` or `cargo ferry doctor --all` output after removing sensitive values.
      render: shell
