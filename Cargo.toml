[workspace]
members = [
    "crates/cargo-ferry",
    "crates/rustferry",
    "crates/rustferry-android",
    "crates/rustferry-apple",
    "crates/rustferry-codegen",
    "crates/rustferry-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
authors = ["ShiroKSH <kushidashiro@gmail.com>"]
repository = "https://github.com/ShiroKSH/rustferry"
homepage = "https://shiroksh.github.io/rustferry/"
readme = "README.md"
keywords = ["rust", "mobile", "android", "ios", "slint"]
categories = ["command-line-utilities", "development-tools::build-utils", "gui"]

[workspace.dependencies]
camino = { version = "1.1.10", features = ["serde1"] }
clap = { version = "4.5.40", features = ["derive", "env", "wrap_help"] }
directories = "6.0.0"
fs2 = "0.4.3"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2.189"
once_cell = "1.21.3"
parking_lot = "0.12.4"
schemars = { version = "1.0.4", features = ["semver1"] }
semver = { version = "1.0.26", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.12"
toml = "0.9.2"
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.17.0", features = ["serde", "v4"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
strip = "symbols"
