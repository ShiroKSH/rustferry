[workspace]
members = [
    "crates/cargo-ferry",
    "crates/rustferry",
    "crates/rustferry-android",
    "crates/rustferry-apple",
    "crates/rustferry-codegen",
    "crates/rustferry-core",
    "crates/rustferry-github",
    "crates/rustferry-remote",
    "crates/rustferry-ssh",
    "crates/rustferry-worker-macos",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
authors = ["ShiroKSH"]
repository = "https://github.com/ShiroKSH/rustferry"
homepage = "https://shiroksh.github.io/rustferry/"
readme = "README.md"

[workspace.dependencies]
base64 = "0.23.1"
camino = { version = "1.1.10", features = ["serde1"] }
cap-std = "4.0.2"
clap = { version = "4.5.40", features = ["derive", "env", "wrap_help"] }
directories = "6.0.0"
fs2 = "0.4.3"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
goblin = { version = "0.10.7", default-features = false, features = ["std", "mach32", "mach64"] }
hex = "0.4.3"
keyring = "4.1.6"
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2.189"
log = "0.4.33"
once_cell = "1.21.3"
openssl = { version = "=0.10.81", default-features = false, features = ["vendored"] }
parking_lot = "0.12.4"
plist = "1.10.0"
rpassword = "7.5.4"
same-file = "1.0.6"
schemars = { version = "1.0.4", features = ["semver1"] }
semver = { version = "1.0.26", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.11.0"
tempfile = "3.20.0"
thiserror = "2.0.12"
toml = "1.1.4"
url = { version = "2.5.4", features = ["serde"] }
unicode-normalization = "0.1.25"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
uuid = { version = "1.17.0", features = ["serde", "v4"] }
windows-sys = { version = "0.61.2", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
strip = "symbols"
